name: CI Database & ETL Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  supabase-tests:
    name: Supabase DDL, Security & ETL Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install API Dependencies
        run: npm ci --prefix api

      - name: Install Admin Dependencies
        run: npm ci --prefix admin

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local Stack
        run: supabase start

      - name: Run Database Reset & Seed
        run: supabase db reset

      - name: Run pgTAP Test Suites
        run: supabase test db

      - name: Test Auth & Data Migration Scripts (Dry Run & Live)
        run: |
          npm run migrate:users:dry
          npm run migrate:users
          npm run migrate:data:dry

      - name: Test Backend API & Scraper Microservice
        run: |
          npm run api:test
          npm run api:build

      - name: Validate Admin Panel
        run: |
          npm run admin:lint
          npm run admin:test
          npm run admin:build
